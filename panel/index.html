<meta charset="utf-8">

<title>Klendar · Panel del negocio</title>
<link rel="icon" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=bar_chart,bolt,campaign,cancel,check_circle,dashboard,event,group,help,location_on,loyalty,menu,photo_camera,qr_code_scanner,redeem,restaurant_menu,storefront,workspace_premium&display=block">

<link rel="stylesheet" href="/admin/admin.css?v=8">
<link rel="stylesheet" href="/panel/panel.css?v=13">

<body class="admin-body">

<!-- Acceso -->
<div id="login" class="login" hidden>
  <a class="brand" href="/"><img src="/assets/symbol.png" alt="" width="30" height="30"> Klendar <small class="muted">· negocios</small></a>
  <h2 style="margin:0">Entra en tu panel</h2>
  <p class="muted" style="margin:0">Con la misma cuenta que usas en la app o en la web. Si tu negocio todavía no está dado de alta, entra y lo das de alta aquí mismo.</p>
  <label class="f"><span>Correo</span><input id="email" type="email" autocomplete="username"></label>
  <label class="f"><span>Contraseña</span><input id="password" type="password" autocomplete="current-password"></label>
  <button class="btn primary" id="doLogin">Entrar</button>
  <button class="btn" id="doGoogle" type="button" hidden>Continuar con Google</button>
  <button class="btn sm ghost" id="doReset" type="button">He olvidado la contraseña</button>
  <div id="loginErr" class="err"></div>
  <p class="muted" style="margin:0">¿Aún no tienes cuenta? <a href="/app/#/registro?para=negocio">Crea una gratis</a> y da de alta tu negocio.</p>
  <span class="lang" id="langLogin" aria-label="Idioma / Language"></span>
</div>

<!-- Panel -->
<div id="app" class="layout" hidden>
  <aside class="side" id="side">
    <a class="brand" href="#/resumen"><img src="/assets/symbol.png" alt=""> Klendar <small>negocios</small></a>
    <div class="bizpick"><select id="bizSelect" aria-label="Negocio"></select>
      <a class="bizpick-mas" href="#/alta">+ Dar de alta otro local</a></div>
    <nav id="nav"></nav>
    <div class="me"><span style="opacity:.6">Sesión</span><b id="who"></b><a href="#" id="logout">Salir</a>
      <span class="lang" id="langSide" aria-label="Idioma / Language"></span></div>
  </aside>
  <div>
    <div class="topbar">
      <a class="brand" href="#/resumen"><img src="/assets/symbol.png" alt=""> Klendar</a>
      <button class="btn sm" id="menuBtn" aria-label="Menú"><span class="ms" aria-hidden="true">menu</span>Menú</button>
      <span class="spacer"></span>
      <span class="lang" id="lang" aria-label="Idioma / Language"></span>
    </div>
    <main class="content" id="view"></main>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<dialog class="modal" id="modal"></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/config.js?v=2"></script>
<script src="/assets/i18n.js?v=2"></script>
<script src="/panel/i18n.js?v=23"></script>
<script src="/assets/vendor/qrcode.js?v=1"></script>
<script src="/panel/panel.js?v=36"></script>
</body>
</html>
